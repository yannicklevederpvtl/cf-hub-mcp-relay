---
applications:
- name: hub-mcp-relay
  metadata:
    labels:
      ai.tanzu.com/type: mcp-server
  path: .
  buildpacks:
  - python_buildpack
  memory: 256M
  disk_quota: 512M
  instances: 1
  routes:
  - route: hub-mcp-relay.apps.internal
  health-check-type: http
  health-check-http-endpoint: /health
  env:
    HUB_MCP_URL: https://hub.tas.<yourdomain>/hub/mcp
